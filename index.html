<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人财务选择权计算器</title><style>:root{--bg:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:rgba(148,163,184,.25);--blue:#38bdf8;--green:#86efac;--yellow:#fde68a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at 0 0,rgba(56,189,248,.16),transparent 34%),radial-gradient(circle at 100% 0,rgba(34,197,94,.13),transparent 32%),var(--bg);color:var(--text);line-height:1.55}.wrap{max-width:1560px;margin:auto;padding:32px 18px 60px}h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:0 0 10px;letter-spacing:-.04em}h2{margin:0 0 12px}.sub{color:var(--muted);max-width:920px}.grid{display:grid;grid-template-columns:380px 1fr;gap:18px;margin-top:24px}@media(max-width:930px){.grid{grid-template-columns:1fr}.side{position:static!important}}.side,.main,.card{background:rgba(17,24,39,.88);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 42px rgba(0,0,0,.32)}.side{padding:18px;position:sticky;top:18px}.main{padding:18px}label{display:grid;gap:6px;margin:0 0 13px;color:#dbeafe;font-weight:700;font-size:13px}.hint{color:var(--muted);font-weight:400;font-size:12px}input,select{width:100%;border:1px solid var(--line);background:#0f172a;color:var(--text);border-radius:12px;padding:11px;font-size:15px}button{width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:var(--blue);color:#04111f}.row,.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{background:rgba(148,163,184,.14);color:var(--text);border:1px solid var(--line)}.note{margin-top:14px;padding:12px;border-radius:12px;background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.25);color:var(--yellow);font-size:12px}.debtBox,#debtToggle{display:none}.toggle{align-items:center;gap:8px;margin:4px 0 12px;color:#dbeafe;font-weight:800;font-size:13px}.toggle input{width:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.card{padding:15px;background:rgba(31,41,55,.72)}.label{color:var(--muted);font-size:12px}.value{font-size:24px;font-weight:900;letter-spacing:-.04em}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.big{font-size:34px;font-weight:950;color:var(--green);letter-spacing:-.05em;margin:8px 0 2px}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:rgba(56,189,248,.13);border:1px solid rgba(56,189,248,.28);color:#bae6fd;font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{padding:10px;border-bottom:1px solid rgba(148,163,184,.17);text-align:right}th:first-child,td:first-child{text-align:left}th{color:#bfdbfe;background:rgba(15,23,42,.72)}.section{margin-top:18px}.report p{margin:0 0 10px;color:#dbeafe}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0f172a;border:1px solid var(--line);padding:12px;border-radius:12px;color:#bfdbfe;font-size:12px;overflow:auto}.bars{display:grid;gap:8px;margin-top:12px}.barrow{display:grid;grid-template-columns:104px 1fr 90px;gap:9px;align-items:center;color:var(--muted);font-size:12px}.bar{height:10px;background:rgba(148,163,184,.18);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#22c55e)}@media(max-width:1280px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:1080px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.metrics,.cards,.split{grid-template-columns:1fr}}</style></head><body><div class="wrap"><span class="pill">现金流 → 年龄约束 → 无收入开销 → 资产路径 → N 档报告</span><h1>个人财务选择权计算器</h1><p class="sub">输入当前月薪、年龄、储蓄和统一收益率，自动生成多档资产路径报告。若职业下行后月薪归零，模型会继续扣除无收入后的年度生活开销。</p><div class="grid"><aside class="side"><label>起薪 / 当前月薪（月薪，税前）<input id="startSalary" type="number" value="28000" step="1000"></label><div class="split"><label>当前年龄<input id="currentAge" type="number" value="22" step="1"></label><label>职业下行年龄<input id="declineAge" type="number" value="35" step="1"></label></div><div class="split"><label>下行时月薪下降（%）<input id="declineRate" type="number" value="30" step="1"></label><label>下行后薪资<select id="postDeclineMode"><option value="freeze">不再上涨</option><option value="continue">继续按涨幅上涨</option><option value="none">关闭下行假设</option></select></label></div><label>无收入后每年开销（元）<input id="noIncomeExpense" type="number" value="100000" step="10000"><span class="hint">当月薪为 0 时，每年从资产中扣除这笔生活开销。</span></label><label>年平均薪酬涨幅（%）<input id="raiseRate" type="number" value="10" step="0.5"></label><label>年平均储蓄率（%）<input id="savingRate" type="number" value="60" step="1"></label><label>已有储蓄 / 已有资产（元）<input id="initialAsset" type="number" value="0" step="10000"></label><label>已有资产处理方式<select id="initialMode"><option value="cash">作为现金底座加入净资产，不参与复利</option><option value="invested">作为初始投资本金参与复利</option></select></label><label>报告年限列表<input id="horizons" type="text" value="5,10,20,30"><span class="hint">用英文逗号分隔，例如：5,10,20,30</span></label><label>统一年化收益率（%）<input id="returnRate" type="number" value="10" step="0.1"></label><label id="debtToggle" class="toggle"><input id="debtEnabled" type="checkbox">启用隐藏高级功能</label><div id="debtBox" class="debtBox"><label>金额（元）<input id="debtAmount" type="number" value="250000" step="10000"></label><div class="split"><label>年利率（%）<input id="debtRate" type="number" value="3" step="0.1"></label><label>期限（年）<input id="debtYears" type="number" value="3" step="1"></label></div><label>资金处理方式<select id="debtMode"><option value="invested">资金投入，参与复利</option><option value="cash">资金作为现金底座</option></select></label></div><label>税务模型<select id="taxMode"><option value="simple">简化个税：年免征额 6 万</option><option value="none">不扣税：按税前收入估算</option></select></label><div class="row"><button id="calcBtn">重新计算</button><button id="resetBtn" class="secondary">恢复默认</button></div><div class="note">无收入年份会扣除年度生活开销，不再默认资产无成本复利。</div></aside><main class="main"><div class="metrics"><div class="metric"><div class="label">最短报告年限</div><div id="minYear" class="value">-</div></div><div class="metric"><div class="label">最长报告年限</div><div id="maxYear" class="value">-</div></div><div class="metric"><div class="label">最长年限期末月薪</div><div id="finalSalary" class="value">-</div></div><div class="metric"><div id="gainLabel" class="label">最长年限投资增量</div><div id="finalGain" class="value">-</div></div></div><section class="section"><h2>N 档报告</h2><div id="cards" class="cards"></div></section><section class="section report"><h2>自动报告</h2><div id="narrative"></div></section><section class="section"><h2>模型公式</h2><div id="formula" class="formula"></div></section><section class="section"><h2>年度明细</h2><div id="yearlyTables"></div></section></main></div></div><script>const TAX=[{u:36000,r:.03,q:0},{u:144000,r:.10,q:2520},{u:300000,r:.20,q:16920},{u:420000,r:.25,q:31920},{u:660000,r:.30,q:52920},{u:960000,r:.35,q:85920},{u:Infinity,r:.45,q:181920}],$=id=>document.getElementById(id);function money(v){return!isFinite(v)?'-':Math.abs(v)>=1e8?(v/1e8).toFixed(2)+' 亿':Math.abs(v)>=1e4?(v/1e4).toFixed(1)+' 万':Math.round(v).toLocaleString('zh-CN')}function pct(v){return(100*v).toFixed(1)+'%'}function showAdv(){let p=new URLSearchParams(location.search);return p.get('debt')==='1'||p.get('enableDebt')==='1'||p.get('advanced')==='debt'||location.hash.toLowerCase().includes('debt')}function tax(income,mode){if(mode==='none')return 0;let x=Math.max(0,income-6e4),b=TAX.find(t=>x<=t.u);return Math.max(0,x*b.r-b.q)}function years(s){let a=String(s).split(/[,，\s]+/).map(x=>parseInt(x,10)).filter(x=>x>0&&x<=80);a=[...new Set(a)].sort((x,y)=>x-y);return a.length?a:[5,10]}function input(){let adv=showAdv();return{adv,start:+$('startSalary').value||0,age:+$('currentAge').value||22,declineAge:+$('declineAge').value||35,decline:(+$('declineRate').value||0)/100,post:$('postDeclineMode').value,raise:(+$('raiseRate').value||0)/100,save:(+$('savingRate').value||0)/100,noIncomeExpense:+$('noIncomeExpense').value||0,initial:+$('initialAsset').value||0,initialMode:$('initialMode').value,years:years($('horizons').value),ret:(+$('returnRate').value||0)/100,taxMode:$('taxMode').value,debtEnabled:adv&&$('debtEnabled').checked,debtAmount:+$('debtAmount').value||0,debtRate:(+$('debtRate').value||0)/100,debtYears:Math.max(1,+$('debtYears').value||1),debtMode:$('debtMode').value}}function salaryAt(y,i){let raw=i.start*Math.pow(1+i.raise,y-1);if(i.post==='none')return raw;let age=i.age+y-1;if(age<i.declineAge)return raw;let ty=Math.max(1,i.declineAge-i.age+1),tr=i.start*Math.pow(1+i.raise,ty-1),d=tr*(1-i.decline);return i.post==='freeze'?d:d*Math.pow(1+i.raise,y-ty)}function withdraw(s,a){if(a<=0)return;let c=Math.min(s.cash,a);s.cash-=c;s.asset-=a-c}function run(n,i,withDebt){let mr=Math.pow(1+i.ret,1/12)-1,s={cash:i.initialMode==='cash'?i.initial:0,asset:i.initialMode==='invested'?i.initial:0},d=withDebt&&i.debtEnabled,repaid=false;if(d){if(i.debtMode==='cash')s.cash+=i.debtAmount;else s.asset+=i.debtAmount}let after=0,saving=0,expenseTotal=0,rows=[];for(let y=1;y<=n;y++){let sal=salaryAt(y,i),pre=sal*12,t=tax(pre,i.taxMode),net=pre-t,sv=sal>0?net*i.save:0,m=sv/12;after+=net;saving+=sv;for(let k=0;k<12;k++)s.asset=s.asset*(1+mr)+m;if(sal<=0&&i.noIncomeExpense>0){withdraw(s,i.noIncomeExpense);expenseTotal+=i.noIncomeExpense}if(d&&y<=i.debtYears)withdraw(s,i.debtAmount*i.debtRate);if(d&&y===i.debtYears&&!repaid){withdraw(s,i.debtAmount);repaid=true}let outstanding=d&&y<i.debtYears?i.debtAmount:0,total=s.cash+s.asset-outstanding;rows.push({y,age:i.age+y-1,sal,net,sv,expense:sal<=0?i.noIncomeExpense:0,total,outstanding})}let outstanding=d&&n<i.debtYears?i.debtAmount:0,total=s.cash+s.asset-outstanding,interest=d?i.debtAmount*i.debtRate*Math.min(n,i.debtYears):0,principal=i.initial+saving;return{n,after,saving,expenseTotal,total,principal,gain:total-principal,finalSalary:salaryAt(n,i),rows,interest,outstanding,repaid:d&&n>=i.debtYears}}function table(xs){return'<thead><tr><th>指标</th><th>数值</th></tr></thead><tbody>'+xs.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')+'</tbody>'}function bars(xs){let m=Math.max(...xs.map(x=>Math.abs(x.v)),1);return'<div class="bars">'+xs.map(x=>`<div class="barrow"><div>${x.k}</div><div class="bar"><span style="width:${Math.max(2,Math.abs(x.v)/m*100)}%"></span></div><div>${money(x.v)}</div></div>`).join('')+'</div>'}function card(base,debt,i){let extra=i.debtEnabled?debt.total-base.total:0,rows=[['期末年龄',base.rows.at(-1).age+' 岁'],['期末月薪',money(base.finalSalary)],['税后工资总收入',money(base.after)],['期间新增储蓄',money(base.saving)],['无收入开销扣除',money(base.expenseTotal)],['期末净资产',money(base.total)],['投资增量','+'+money(base.gain)]];if(i.debtEnabled)rows.push(['高级功能后净资产',money(debt.total)],['累计成本',money(debt.interest)],['未偿还本金',money(debt.outstanding)],['是否已到期处理',debt.repaid?'已处理':'未到期'],['高级功能额外增量',(extra>=0?'+':'')+money(extra)]);return`<section class="card"><span class="pill">${base.n} 年报告 · 年化 ${pct(i.ret)}</span><div class="big">${money(i.debtEnabled?debt.total:base.total)}</div><p class="hint">${i.debtEnabled?'已计入隐藏高级模块':'基础资产路径'}</p><table>${table(rows)}</table>${bars(i.debtEnabled?[{k:'基础',v:base.total},{k:'高级后',v:debt.total},{k:'额外增量',v:extra}]:[{k:'本金合计',v:base.principal},{k:'期末资产',v:base.total},{k:'投资增量',v:Math.max(0,base.gain)}])}</section>`}function yearly(r){return`<div class="card section"><h3>${r.n} 年路径</h3><table><thead><tr><th>年份</th><th>年龄</th><th>月薪</th><th>税后收入</th><th>年度储蓄</th><th>无收入开销</th><th>期末净资产</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>第 ${x.y} 年</td><td>${x.age} 岁</td><td>${money(x.sal)}</td><td>${money(x.net)}</td><td>${money(x.sv)}</td><td>${money(x.expense)}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table></div>`}function narr(i,bases,debts){let last=bases.at(-1),ld=debts.at(-1),extra=i.debtEnabled?ld.total-last.total:0,adv=i.debtEnabled?`<p>已启用隐藏高级模块。最长年限下，额外增量约 <b>${extra>=0?'+':''}${money(extra)}</b>。</p>`:'';return`<p>当前月薪 <b>${money(i.start)}</b>，当前年龄 <b>${i.age} 岁</b>，储蓄率 <b>${pct(i.save)}</b>，统一年化收益率 <b>${pct(i.ret)}</b>。若月薪为 0，每年扣除生活开销 <b>${money(i.noIncomeExpense)}</b>。</p>${adv}<p>最长 ${last.n} 年后，期末净资产约 <b>${money(i.debtEnabled?ld.total:last.total)}</b>。期间累计无收入开销扣除约 <b>${money(last.expenseTotal)}</b>。</p>`}function formula(i){return i.adv?'当月薪 > 0：年度储蓄 = 税后收入 × 储蓄率。<br>当月薪 = 0：年度储蓄 = 0，并扣除“无收入后每年开销”。<br>隐藏高级模块：URL 带 ?debt=1、?advanced=debt 或 #debt 时才展示；相关表单、报告字段和表格字段默认隐藏。':'当月薪 > 0：年度储蓄 = 税后收入 × 储蓄率。<br>当月薪 = 0：年度储蓄 = 0，并从资产中扣除“无收入后每年开销”。<br>期末净资产 = 现金底座 + 投资资产。'}function calc(){let adv=showAdv();$('debtToggle').style.display=adv?'flex':'none';if(!adv)$('debtEnabled').checked=false;let i=input();$('debtBox').style.display=adv&&i.debtEnabled?'block':'none';let bs=i.years.map(y=>run(y,i,false)),ds=i.years.map(y=>run(y,i,true)),last=i.debtEnabled?ds.at(-1):bs.at(-1),baseLast=bs.at(-1);$('minYear').textContent=bs[0].n+' 年';$('maxYear').textContent=baseLast.n+' 年';$('finalSalary').textContent=money(baseLast.finalSalary);$('gainLabel').textContent=i.debtEnabled?'最长年限额外增量':'最长年限投资增量';$('finalGain').textContent=i.debtEnabled?((last.total-baseLast.total>=0?'+':'')+money(last.total-baseLast.total)):('+'+money(baseLast.gain));$('cards').innerHTML=bs.map((b,idx)=>card(b,ds[idx],i)).join('');$('narrative').innerHTML=narr(i,bs,ds);$('formula').innerHTML=formula(i);$('yearlyTables').innerHTML=(i.debtEnabled?ds:bs).map(yearly).join('')}function reset(){$('startSalary').value=28000;$('currentAge').value=22;$('declineAge').value=35;$('declineRate').value=30;$('postDeclineMode').value='freeze';$('noIncomeExpense').value=100000;$('raiseRate').value=10;$('savingRate').value=60;$('initialAsset').value=0;$('initialMode').value='cash';$('horizons').value='5,10,20,30';$('returnRate').value=10;$('debtEnabled').checked=false;$('debtAmount').value=250000;$('debtRate').value=3;$('debtYears').value=3;$('debtMode').value='invested';$('taxMode').value='simple';calc()}$('calcBtn').addEventListener('click',calc);$('resetBtn').addEventListener('click',reset);window.addEventListener('hashchange',calc);document.querySelectorAll('input,select').forEach(e=>{e.addEventListener('input',calc);e.addEventListener('change',calc);e.addEventListener('click',()=>setTimeout(calc,0))});calc();</script></body></html>
